<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Paper-2 Full Syllabus Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        .quiz-container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
            font-size: 24px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        #unit-tag {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        #progress {
            color: #64748b;
            font-size: 15px;
            font-weight: bold;
        }
        #question {
            font-size: 19px;
            line-height: 1.5;
            margin: 15px 0;
            font-weight: bold;
            color: #0f172a;
        }
        .english {
            color: #475569;
            font-size: 15px;
            margin-top: 6px;
            font-weight: normal;
        }
        .option {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .option:hover {
            background: #f1f5f9;
        }
        .correct {
            background: #dcfce7 !important;
            border-color: #16a34a !important;
            font-weight: bold;
            color: #14532d;
        }
        .wrong {
            background: #fee2e2 !important;
            border-color: #dc2626 !important;
            color: #7f1d1d;
        }
        #answer {
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.5;
        }
        #nextBtn, #restartBtn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        #nextBtn:hover, #restartBtn:hover {
            background: #1d4ed8;
        }
        #nextBtn {
            display: none;
        }
        #score {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>🌐 Geography Paper-2 (Units 1-10) Quiz</h1>
    
    <div class="quiz-header">
        <span id="unit-tag">Set 1</span>
        <div id="progress"></div>
    </div>

    <div id="question"></div>
    <div id="options"></div>
    <div id="answer"></div>
    
    <button id="nextBtn" onclick="nextQuestion()">अगला प्रश्न (Next) ➡</button>
    <div id="result"></div>
</div>

<script>
const questions = [
    // Unit 1: Geomorphology
    {
        unit: "Unit 1: भू-आकृति विज्ञान (Geomorphology)",
        question: "निम्नलिखित में से कौन सा अपरदन चक्र (Cycle of Erosion) पेंक (Penck) द्वारा प्रस्तुत किया गया था?",
        english: "Which Cycle of Erosion was proposed by Walther Penck?",
        options: ["पैनप्लेनेशन (Panplanation)", "प्राइमराम्फ और एन्ड्राम्फ (Primarump & Endrump)", "पेडीप्लेनेशन (Pediplanation)", "पेनेप्लेन (Peneplain)"],
        answer: 1
    },
    // Unit 2: Climatology
    {
        unit: "Unit 2: जलवायु विज्ञान (Climatology)",
        question: "तापीय विलोमता (Thermal Inversion) के लिए निम्नलिखित में से कौन सी दशा सबसे उपयुक्त है?",
        english: "Which condition is most suitable for Temperature Inversion?",
        options: ["लंबी रातें, शांत हवा और स्वच्छ आकाश", "छोटी रातें और तेज हवाएं", "मेघाच्छन्न आकाश और आर्द्र हवा", "ग्रीष्म ऋतु की दोपहर"],
        answer: 0
    },
    // Unit 3: Oceanography
    {
        unit: "Unit 3: समुद्र विज्ञान (Oceanography)",
        question: "विश्व की सबसे अधिक लवणता (Salinity) निम्नलिखित में से किस जल निकाय में पाई जाती है?",
        english: "Which water body has the highest salinity in the world?",
        options: ["मृत सागर (Dead Sea)", "वान झील (Lake Van)", "ग्रेट साल्ट लेक (Great Salt Lake)", "लाल सागर (Red Sea)"],
        answer: 1
    },
    // Unit 4: Environmental Geography
    {
        unit: "Unit 4: पर्यावरण भूगोल (Environmental Geography)",
        question: "मॉन्ट्रियल प्रोटोकॉल (Montreal Protocol, 1987) का मुख्य उद्देश्य क्या था?",
        english: "What was the main objective of the Montreal Protocol (1987)?",
        options: ["जैविक विविधता संरक्षण", "ओजोन परत को नुकसान पहुंचाने वाले पदार्थों पर नियंत्रण", "ग्रीनहाउस गैसों में कमी", "सतत विकास"],
        answer: 1
    },
    // Unit 5: Population & Settlement Geography
    {
        unit: "Unit 5: जनसंख्या एवं अधिवास भूगोल",
        question: "जनसंख्या के 'माइग्रेशन के नियम' (Laws of Migration) का प्रतिपादन सर्वप्रथम किसने किया था?",
        english: "Who first formulated the 'Laws of Migration'?",
        options: ["जी. के. ज़िफ (G. K. Zipf)", "ई. जी. रेवेन्स्टीन (E. G. Ravenstein)", "डब्ल्यू. ज़ेलिंस्की (W. Zelinsky)", "सैम्युअल स्टोफ़र"],
        answer: 1
    },
    // Unit 6: Economic & Regional Geography
    {
        unit: "Unit 6: आर्थिक एवं प्रादेशिक भूगोल",
        question: "थॉनेन के कृषि अवस्थिति सिद्धांत (Von Thünen's Model) में केंद्रीय नगर के सबसे निकट कौन सी वलय (Ring) होती है?",
        english: "In Von Thünen's model, which belt is located closest to the central city?",
        options: ["ईंधन लकड़ी और भवन निर्माण लकड़ी", "सघन बागाती कृषि एवं दुग्ध उत्पादन", "अनाज उत्पादन", "पशुपालन"],
        answer: 1
    },
    // Unit 7: Cultural, Social & Political Geography
    {
        unit: "Unit 7: सांस्कृतिक, सामाजिक एवं राजनीतिक भूगोल",
        question: "एन. जे. स्पाइकमेन (N. J. Spykman) द्वारा प्रतिपादित भू-राजनीतिक सिद्धांत का नाम क्या है?",
        english: "What is the name of the geopolitical theory proposed by N. J. Spykman?",
        options: ["हार्टलैंड सिद्धांत (Heartland Theory)", "रिम्लैंड सिद्धांत (Rimland Theory)", "वायु शक्ति सिद्धांत (Air Power Theory)", "समुद्री शक्ति सिद्धांत"],
        answer: 1
    },
    // Unit 8: Geographical Thought
    {
        unit: "Unit 8: भौगोलिक चिंतन (Geographical Thought)",
        question: "'कॉस्मोस' (Cosmos) नामक महान कृति के लेखक कौन से जर्मन भूगोलवेत्ता हैं?",
        english: "Which German geographer wrote the famous work 'Cosmos'?",
        options: ["इमैनुएल कांट", "अलेक्जेंडर वॉन हम्बोल्ट (Alexander von Humboldt)", "कार्ल रिटर", "ओस्कर पेशेल"],
        answer: 1
    },
    // Unit 9: Geographical Techniques
    {
        unit: "Unit 9: भौगोलिक तकनीकें (Cartography & GIS)",
        question: "आर.एफ. (R.F.) 1:50,000 वाले मानचत्रि पर 2 सेमी की दूरी वास्तव में धरातल पर कितनी दूरी दर्शाती है?",
        english: "On a map with R.F. 1:50,000, a distance of 2 cm represents how much actual ground distance?",
        options: ["1 किमी (1 km)", "2 किमी (2 km)", "5 किमी (5 km)", "10 किमी (10 km)"],
        answer: 0
    },
    // Unit 10: Geography of India
    {
        unit: "Unit 10: भारत का भूगोल (Geography of India)",
        question: "निम्नलिखित में से कौन सी पर्वत श्रृंखला भारत में उत्तर से दक्षिण के क्रम में सही है?",
        english: "Which mountain range sequence is correct from North to South in India?",
        options: ["काराकोरम - लद्दाख - जास्कर - पीर पंजाल", "लद्दाख - काराकोरम - पीर पंजाल - जास्कर", "जास्कर - लद्दाख - पीर पंजाल - काराकोरम", "पीर पंजाल - जास्कर - लद्दाख - काराकोरम"],
        answer: 0
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById("unit-tag").innerText = q.unit;
    document.getElementById("progress").innerText = 
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML = 
        q.question + "<div class='english'>🇬🇧 " + q.english + "</div>";

    document.getElementById("answer").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.className = "option";
        button.onclick = function() {
            checkAnswer(index, button);
        };
        optionsDiv.appendChild(button);
    });
}

function checkAnswer(selectedIndex, selectedButton) {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    if (selectedIndex === q.answer) {
        score++;
        document.getElementById("answer").innerHTML = 
            "<strong style='color: #16a34a;'>✅ सही उत्तर! (Correct)</strong><br>" +
            "<b>उत्तर:</b> " + q.options[q.answer];
    } else {
        selectedButton.classList.add("wrong");
        document.getElementById("answer").innerHTML = 
            "<strong style='color: #dc2626;'>❌ गलत उत्तर! (Wrong)</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    }

    document.getElementById("nextBtn").style.display = "inline-block";

    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "परिणाम देखें (See Final Score) 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "अगला प्रश्न (Next Question) ➡";
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("question").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("answer").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress").style.display = "none";
    document.getElementById("unit-tag").style.display = "none";

    document.getElementById("result").innerHTML = `
        <div id="score">
            🎉 पहला सेट पूरा हुआ!
            <br><br>
            आपका स्कोर: ${score} / ${questions.length}
            <br><br>
            <button id="restartBtn" onclick="restartQuiz()">
                🔄 इसे पुनः हल करें (Restart)
            </button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("question").style.display = "block";
    document.getElementById("options").style.display = "block";
    document.getElementById("answer").style.display = "block";
    document.getElementById("progress").style.display = "block";
    document.getElementById("unit-tag").style.display = "inline-block";

    document.getElementById("result").innerHTML = "";

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
