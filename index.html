ut the polar jet stream is NOT true?", "hi": "ध्रुवीय जेट स्ट्रीम के बारे में कौन-सा कथन सही नहीं है?", "opts": ["It moves northwards during summer", "It supplies energy to the circulation of surface storms", "Its location roughly coincides with the polar front", "Its velocity is greater during summer"], "ans": "D", "ansHi": "गर्मियों में इसकी वेग अधिक होता है", "optsHi": ["यह गर्मियों में उत्तर की ओर खिसकती है", "यह सतही तूफानों के परिसंचरण को ऊर्जा प्रदान करती है", "इसका स्थान लगभग ध्रुवीय वाताग्र के साथ मिलता है", "गर्मियों में इसका वेग अधिक होता है"]}, {"n": 9, "en": "The percentage of water vapour in tropical regions may be as high as:", "hi": "उष्णकटिबंधीय क्षेत्रों में जलवाष्प का प्रतिशत अधिकतम लगभग कितना हो सकता है?", "opts": ["4 percent", "10 percent", "30 percent", "50 percent"], "ans": "A", "ansHi": "4 प्रतिशत", "optsHi": ["4 प्रतिशत", "10 प्रतिशत", "30 प्रतिशत", "50 प्रतिशत"]}, {"n": 10, "en": "The vertical air flow in an anticyclone is:", "hi": "प्रतिचक्रवात (Anticyclone) में ऊर्ध्वाधर वायु प्रवाह कैसा होता है?", "opts": ["Divergence aloft", "Convergence aloft", "Divergence both aloft and at the surface", "Convergence at the surface and aloft"], "ans": "B", "ansHi": "ऊपरी वायुमंडल में अभिसरण", "optsHi": ["ऊपर की ओर अपसरण", "ऊपर की ओर अभिसरण", "ऊपर और सतह दोनों पर अपसरण", "सतह और ऊपर दोनों पर अभिसरण"]}, {"n": 11, "en": "The most common salt in the ocean is:", "hi": "महासागर में सबसे सामान्य लवण कौन-सा है?", "opts": ["Calcium chloride", "Magnesium sulphate", "Sodium chloride", "Potassium chloride"], "ans": "C", "ansHi": "सोडियम क्लोराइड", "optsHi": ["कैल्शियम क्लोराइड", "मैग्नीशियम सल्फेट", "सोडियम क्लोराइड", "पोटैशियम क्लोराइड"]}, {"n": 12, "en": "In the hydrological cycle, evaporation is preceded mainly by:", "hi": "जलचक्र में वाष्पीकरण मुख्यतः किससे ऊर्जा प्राप्त करता है?", "opts": ["Clouds", "Precipitation", "Heat", "Condensation"], "ans": "C", "ansHi": "ऊष्मा", "optsHi": ["बादल", "वर्षण", "ऊष्मा", "संघनन"]}, {"n": 13, "en": "Which of the following occupies Trophic Level I in a food chain?", "hi": "खाद्य शृंखला में ट्रॉफिक स्तर I पर कौन होता है?", "opts": ["Bacteria", "Carnivores", "Primary consumers", "Plants"], "ans": "D", "ansHi": "पौधे", "optsHi": ["बैक्टीरिया", "मांसाहारी", "प्राथमिक उपभोक्ता", "पौधे"]}, {"n": 14, "en": "Which region is known as a major carbon sink of the globe?", "hi": "निम्न में से कौन-सा क्षेत्र विश्व के प्रमुख कार्बन सिंक के रूप में जाना जाता है?", "opts": ["Antarctica", "Savanna", "North-West Europe", "Tropical rainforest"], "ans": "D", "ansHi": "उष्णकटिबंधीय वर्षावन", "optsHi": ["अंटार्कटिका", "सवाना", "उत्तर-पश्चिमी यूरोप", "उष्णकटिबंधीय वर्षावन"]}, {"n": 15, "en": "Ecological niche refers to:", "hi": "पारिस्थितिक niche से क्या तात्पर्य है?", "opts": ["Interaction between man and environment", "The functional role of an organism in an ecosystem", "Interdependence of man and plants", "None of the above"], "ans": "B", "ansHi": "पारितंत्र में किसी जीव की कार्यात्मक भूमिका", "optsHi": ["मनुष्य और पर्यावरण के बीच अंतःक्रिया", "पारिस्थितिकी तंत्र में किसी जीव की कार्यात्मक भूमिका", "मनुष्य और पौधों की परस्पर निर्भरता", "इनमें से कोई नहीं"]}, {"n": 16, "en": "Who expounded the concept that 'the present is the key to the past'?", "hi": "'वर्तमान अतीत की कुंजी है' की अवधारणा किसने प्रतिपादित की?", "opts": ["Buffon", "Lyell", "Hutton", "Playfair"], "ans": "C", "ansHi": "हटन (Hutton)", "optsHi": ["बुफॉन (Buffon)", "लायल (Lyell)", "हटन (Hutton)", "प्लेफेयर (Playfair)"]}, {"n": 17, "en": "The approach that some of Ritter's facts could not be explained scientifically is termed:", "hi": "रिटर के कुछ तथ्यों को वैज्ञानिक रूप से न समझ पाने वाली दार्शनिक दृष्टि को क्या कहा गया?", "opts": ["Ecological", "Regional", "Teleological", "Locational"], "ans": "C", "ansHi": "टेलीओलॉजिकल / प्रयोजनवादी दृष्टिकोण", "optsHi": ["पारिस्थितिक", "प्रादेशिक", "टेलीओलॉजिकल/प्रयोजनवादी", "स्थानिक"]}, {"n": 18, "en": "Whose pioneer statement, according to Hartshorne, set the direction of modern geographical thought?", "hi" const letters = ["A","B","C","D"];
const form = document.getElementById("quiz");
let attempted = 0;
let correct = 0;

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

questions.forEach(q => {
  const card = document.createElement("section");
  card.className = "card";
  let opts = "";
  q.opts.forEach((o,i) => {
    opts += `<label class="option" id="opt-${q.n}-${letters[i]}">
      <input type="radio" name="q${q.n}" value="${letters[i]}">
      <b>${letters[i]}.</b> <span class="hiOpt">${esc(q.optsHi[i])}</span><span class="enOpt">${esc(o)}</span>
    </label>`;
  });

  card.innerHTML = `
    <div class="qno">December 2012 — Question ${q.n}</div>
    <div class="q">${esc(q.en)}</div>
    <div class="hi">${esc(q.hi)}</div>
    ${opts}
    <div class="feedback" id="fb-${q.n}"></div>
  `;
  form.appendChild(card);

  card.querySelectorAll('input[type="radio"]').forEach(input => {
    input.addEventListener("change", () => reveal(q.n, input.value));
  });
});

function reveal(n, selected) {
  const q = questions[n-1];
  const card = form.querySelectorAll(".card")[n-1];
  if (card.dataset.answered === "1") return;
  card.dataset.answered = "1";

  attempted++;
  const isCorrect = selected === q.ans;
  if (isCorrect) correct++;

  card.classList.add(isCorrect ? "correct" : "wrong");

  card.querySelectorAll(".option").forEach(x => {
    x.style.pointerEvents = "none";
  });

  document.getElementById(`opt-${n}-${q.ans}`).classList.add("correctOpt");
  if (!isCorrect) {
    document.getElementById(`opt-${n}-${selected}`).classList.add("wrongOpt");
  }

  const fb = document.getElementById(`fb-${n}`);
  fb.classList.add("show");
  fb.innerHTML = isCorrect
    ? `<b>✓ Correct / सही!</b><br>आपका उत्तर / Your answer: <b>${q.ans}</b><br>सही उत्तर / Correct answer: <b>${q.ans}. ${esc(q.ansHi)}</b><br><span class="enAns">English: ${esc(q.opts[letters.indexOf(q.ans)])}</span>`
    : `<b>✗ Wrong / गलत!</b><br>आपका उत्तर / Your answer: <b>${selected}</b><br>सही उत्तर / Correct answer: <b>${q.ans}. ${esc(q.ansHi)}</b><br><span class="enAns">English: ${esc(q.opts[letters.indexOf(q.ans)])}</span>`;

  updateScore();
}

function updateScore() {
  document.getElementById("score").textContent =
    `Attempted: ${attempted}/50 • Correct: ${correct}`;
}

function submitQuiz() {
  updateScore();
  const pct = (correct / 50 * 100).toFixed(1);
  alert(`Final Score: ${correct}/50\nPercentage: ${pct}%\nAttempted: ${attempted}/50`);
}
</script>
</body>
</html>
