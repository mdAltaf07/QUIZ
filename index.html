let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById("unit-tag").innerText = q.unit;
    document.getElementById("progress").innerText = 
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML = 
        q.question + "<div class='english'>🇬🇧 " + q.english + "</div>";

    document.getElementById("answer").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.className = "option";
        button.onclick = function() {
            checkAnswer(index, button);
        };
        optionsDiv.appendChild(button);
    });
}

function checkAnswer(selectedIndex, selectedButton) {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    if (selectedIndex === q.answer) {
        score++;
        document.getElementById("answer").innerHTML = 
            "<strong style='color: #16a34a;'>✅ सही उत्तर! (Correct)</strong><br>" +
            "<b>उत्तर:</b> " + q.options[q.answer];
    } else {
        selectedButton.classList.add("wrong");
        document.getElementById("answer").innerHTML = 
            "<strong style='color: #dc2626;'>❌ गलत उत्तर! (Wrong)</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    }

    document.getElementById("nextBtn").style.display = "inline-block";

    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "अंतिम परिणाम देखें (See Final Result) 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "अगला प्रश्न (Next Question) ➡";
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("question").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("answer").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress").style.display = "none";
    document.getElementById("unit-tag").style.display = "none";

    let percentage = (score / questions.length) * 100;
    let remarks = "";
    if (percentage >= 80) remarks = "🌟 उत्कृष्ट प्रदर्शन! (Excellent)";
    else if (percentage >= 60) remarks = "👍 अच्छा प्रयास! (Good)";
    else remarks = "📚 और अभ्यास की आवश्यकता है। (Keep Learning)";

    document.getElementById("result").innerHTML = `
        <div id="score">
            🎉 50 प्रश्नों की क्विज़ पूरी हुई!
            <br><br>
            आपका कुल स्कोर: ${score} / ${questions.length} (${percentage.toFixed(1)}%)
            <br><br>
            <div style="font-size: 18px; color: #1e40af;">${remarks}</div>
            <br>
            <button id="restartBtn" onclick="restartQuiz()">
                🔄 इसे पुनः हल करें (Restart Quiz)
            </button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("question").style.display = "block";
    document.getElementById("options").style.display = "block";
    document.getElementById("answer").style.display = "block";
    document.getElementById("progress").style.display = "block";
    document.getElementById("unit-tag").style.display = "inline-block";

    document.getElementById("result").innerHTML = "";

    loadQuestion();
}

loadQuestion();
</script>
