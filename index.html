<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography UGC NET/JRF Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            margin: 0;
            padding: 0;
        }
        .quiz-container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #15803d;
            margin-top: 0;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        #progress {
            color: #475569;
            font-size: 16px;
            font-weight: bold;
        }
        #question {
            font-size: 20px;
            line-height: 1.5;
            margin: 20px 0;
            font-weight: bold;
            color: #1e293b;
        }
        .english {
            color: #475569;
            font-size: 16px;
            margin-top: 6px;
            font-weight: normal;
        }
        .option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .option:hover {
            background: #f1f5f9;
        }
        .correct {
            background: #bbf7d0 !important;
            border-color: #16a34a !important;
            font-weight: bold;
            color: #14532d;
        }
        .wrong {
            background: #fecaca !important;
            border-color: #dc2626 !important;
            color: #7f1d1d;
        }
        #answer {
            margin-top: 15px;
            font-size: 17px;
            line-height: 1.5;
        }
        #nextBtn, #restartBtn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #15803d;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }
        #nextBtn:hover, #restartBtn:hover {
            background: #166534;
        }
        #nextBtn {
            display: none;
        }
        #score {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>🌍 Geography NET/JRF Quiz</h1>
    
    <div class="quiz-header">
        <div id="progress"></div>
    </div>

    <div id="question"></div>
    <div id="options"></div>
    <div id="answer"></div>
    
    <button id="nextBtn" onclick="nextQuestion()">अगला प्रश्न (Next) ➡</button>
    <div id="result"></div>
</div>

<script>
const questions = [
    {
        question: "'वर्तमान भूत की कुंजी है' (Present is the key to the past) यह कथन किस विद्वान का है?",
        english: "Who said 'Present is the key to the past'?",
        options: ["डब्ल्यू. एम. डेविस (W. M. Davis)", "जेम्स हटन (James Hutton)", "वाल्थर पेंक (Walther Penck)", "कार्ल गिलबर्ट (Karl Gilbert)"],
        answer: 1
    },
    {
        question: "कोपेन (Köppen) के जलवायु वर्गीकरण के अनुसार 'Afs' जलवायु किसे प्रदर्शित करती है?",
        english: "According to Köppen's classification, what does 'Afs' represent?",
        options: ["मानसून जलवायु", "भूमध्यसागरीय जलवायु", "भूमध्यरेखीय उष्णकटिबंधीय वर्षावन जलवायु", "सवाना जलवायु"],
        answer: 2
    },
    {
        question: "कोरिओलिस बल (Coriolis Force) के संबंध में कौन सा कथन सत्य है?",
        english: "Which statement is true regarding Coriolis Force?",
        options: ["यह विषुवत रेखा पर अधिकतम होता है", "यह ध्रुवों पर शून्य होता है", "यह ध्रुवों पर अधिकतम और विषुवत रेखा पर शून्य होता है", "यह पवन की गति को बढ़ाता है"],
        answer: 2
    },
    {
        question: "निम्नलिखित में से कौन सी ठंडी महासागरीय धारा (Cold Ocean Current) है?",
        english: "Which of the following is a Cold Ocean Current?",
        options: ["गल्फ स्ट्रीम (Gulf Stream)", "क्यूरोशियो धारा (Kuroshio)", "कैनारी धारा (Canary Current)", "ब्राजील धारा (Brazil Current)"],
        answer: 2
    },
    {
        question: "पारिस्थितिकी तंत्र (Ecosystem) शब्द का प्रयोग सर्वप्रथम किसने किया था?",
        english: "Who coined the term 'Ecosystem'?",
        options: ["ई. पी. ओडम", "ए. जी. टांसले (A. G. Tansley)", "अर्नेस्ट हेकेल", "रामदेव मिश्र"],
        answer: 1
    },
    {
        question: "'अण्डकुण्डे' (Erdkunde) पुस्तक के लेखक कौन हैं?",
        english: "Who is the author of the book 'Erdkunde'?",
        options: ["अलेक्जेंडर वॉन हम्बोल्ट", "कार्ल रिटर (Carl Ritter)", "फ्रेडरिक रेटजेल", "अल्फेर्ड हेटनर"],
        answer: 1
    },
    {
        question: "क्रिस्टॉलर (Christaller) के केंद्रीय स्थल सिद्धांत में प्रशासनिक नियम (Administrative Principle) के लिए K का मान क्या है?",
        english: "What is the K-value for Administrative Principle in Christaller's Central Place Theory?",
        options: ["K = 3", "K = 4", "K = 7", "K = 9"],
        answer: 2
    },
    {
        question: "अल्फेर्ड वेबर के औद्योगिक अवस्थिति सिद्धांत में 'आइसोडापेन' (Isodapane) रेखाएँ क्या दर्शाती हैं?",
        english: "In Weber's theory, what do 'Isodapane' lines represent?",
        options: ["समान कच्चा माल लागत", "समान परिवहन लागत (Equal Transport Cost)", "समान श्रम लागत", "समान बाजार मूल्य"],
        answer: 1
    },
    {
        question: "भारत की कौन सी नदी कर्क रेखा (Tropic of Cancer) को दो बार काटती है?",
        english: "Which river in India crosses the Tropic of Cancer twice?",
        options: ["नर्मदा नदी", "ताप्ती नदी", "माही नदी (Mahi River)", "साबरमती नदी"],
        answer: 2
    },
    {
        question: "'हार्टलैंड सिद्धांत' (Heartland Theory) का प्रतिपादन किसने किया था?",
        english: "Who proposed the 'Heartland Theory'?",
        options: ["एन. जे. स्पाइकमेन", "एच. जे. मैकिंडर (H. J. Mackinder)", "ए. टी. महान", "सेवेरस्की"],
        answer: 1
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById("progress").innerText = 
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML = 
        q.question + "<div class='english'>🇬🇧 " + q.english + "</div>";

    document.getElementById("answer").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.className = "option";
        button.onclick = function() {
            checkAnswer(index, button);
        };
        optionsDiv.appendChild(button);
    });
}

function checkAnswer(selectedIndex, selectedButton) {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    if (selectedIndex === q.answer) {
        score++;
        document.getElementById("answer").innerHTML = 
            "<strong style='color: #16a34a;'>✅ सही उत्तर! (Correct)</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    } else {
        selectedButton.classList.add("wrong");
        document.getElementById("answer").innerHTML = 
            "<strong style='color: #dc2626;'>❌ गलत उत्तर! (Wrong)</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    }

    document.getElementById("nextBtn").style.display = "inline-block";

    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "परिणाम देखें (See Result) 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "अगला प्रश्न (Next) ➡";
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("question").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("answer").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress").style.display = "none";

    document.getElementById("result").innerHTML = `
        <div id="score">
            🎉 क्विज़ पूरा हुआ!
            <br><br>
            आपका स्कोर: ${score} / ${questions.length}
            <br><br>
            <button id="restartBtn" onclick="restartQuiz()">
                🔄 दोबारा शुरू करें (Restart)
            </button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("question").style.display = "block";
    document.getElementById("options").style.display = "block";
    document.getElementById("answer").style.display = "block";
    document.getElementById("progress").style.display = "block";

    document.getElementById("result").innerHTML = "";

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
