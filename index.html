let currentPage = 0;
const pageSize = 10;
let userAnswers = new Array(quizData.length).fill(null);

function renderPage() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    
    const start = currentPage * pageSize;
    const end = Math.min(start + pageSize, quizData.length);
    
    for (let i = start; i < end; i++) {
        const item = quizData[i];
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let pyqHtml = item.pyq ? '<span class="pyq-tag">NET PYQ</span>' : '';
        
        let optionsHtml = '';
        item.opts.forEach((opt, optIdx) => {
            let btnClass = 'opt-btn';
            let disabled = '';
            
            if (userAnswers[i] !== null) {
                disabled = 'disabled';
                if (optIdx === item.ans) {
                    btnClass += ' correct';
                } else if (userAnswers[i] === optIdx) {
                    btnClass += ' wrong';
                }
            }
            
            optionsHtml += `<button class="${btnClass}" ${disabled} onclick="selectOption(${i}, ${optIdx})">${String.fromCharCode(65+optIdx)}) ${opt}</button>`;
        });
        
        let expStyle = userAnswers[i] !== null ? 'style="display:block;"' : '';

        card.innerHTML = `
            <div class="q-text">${item.q} ${pyqHtml}</div>
            <div class="options">${optionsHtml}</div>
            <div class="exp-box" ${expStyle}><b>व्याख्या:</b> ${item.exp}</div>
        `;
        container.appendChild(card);
    }

    // Update Pagination UI
    document.getElementById('page-num').innerText = `Page ${currentPage + 1} / ${Math.ceil(quizData.length / pageSize)}`;
    document.getElementById('prev-btn').disabled = currentPage === 0;
    
    if (currentPage === Math.ceil(quizData.length / pageSize) - 1) {
        document.getElementById('next-btn').innerText = 'Submit';
    } else {
        document.getElementById('next-btn').innerText = 'अगला';
    }
}

function selectOption(qIdx, optIdx) {
    userAnswers[qIdx] = optIdx;
    renderPage();
}

function changePage(dir) {
    const maxPage = Math.ceil(quizData.length / pageSize) - 1;
    
    if (currentPage === maxPage && dir === 1) {
        showResults();
        return;
    }
    
    currentPage += dir;
    if (currentPage < 0) currentPage = 0;
    if (currentPage > maxPage) currentPage = maxPage;
    
    renderPage();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    
    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].ans) score++;
    });
    
    document.getElementById('score-text').innerText = `${score} / ${quizData.length}`;
    document.getElementById('percent-text').innerText = `आपका कुल प्रतिशत: ${((score / quizData.length) * 100).toFixed(1)}%`;
}

// Initial Render
renderPage();
</script>
