<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geomorphology NET/JRF Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            margin: 0;
            padding: 0;
        }
        .quiz-container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-top: 0;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef4ff;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        #progress {
            color: #555;
            font-size: 16px;
            font-weight: bold;
        }
        #timer {
            font-size: 17px;
            font-weight: bold;
            color: #d97706;
            background: #fef3c7;
            padding: 6px 14px;
            border-radius: 20px;
        }
        #question {
            font-size: 20px;
            line-height: 1.5;
            margin: 20px 0;
            font-weight: bold;
        }
        .hindi {
            color: #374151;
            font-size: 18px;
            margin-top: 8px;
        }
        .option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .option:hover {
            background: #eef4ff;
        }
        .correct {
            background: #b7f7c1 !important;
            border-color: green !important;
            font-weight: bold;
        }
        .wrong {
            background: #ffb7b7 !important;
            border-color: red !important;
        }
        #answer {
            margin-top: 15px;
            font-size: 18px;
            line-height: 1.5;
        }
        #nextBtn, #restartBtn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }
        #nextBtn:hover, #restartBtn:hover {
            background: #153da8;
        }
        #nextBtn {
            display: none;
        }
        #score {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>⛰️ Geomorphology Quiz</h1>
    
    <div class="quiz-header">
        <div id="progress"></div>
        <div id="timer">⏱️ Time: 45s</div>
    </div>

    <div id="question"></div>
    <div id="options"></div>
    <div id="answer"></div>
    
    <button id="nextBtn" onclick="nextQuestion()">Next Question ➡</button>
    <div id="result"></div>
</div>

<script>
const questions = [
    {
        question: "Who proposed the concept of 'Cycle of Erosion' in Geomorphology?",
        hindi: "भू-आकृति विज्ञान में 'अपरदन चक्र' (Cycle of Erosion) की अवधारणा का प्रतिपादन किसने किया था?",
        options: ["W.M. Davis", "Walther Penck", "L.C. King", "G.K. Gilbert"],
        answer: 0
    },
    {
        question: "Which of the following is an example of an endogenetic process?",
        hindi: "निम्नलिखित में से कौन-सी एक अंतर्जात प्रक्रिया (Endogenetic process) का उदाहरण है?",
        options: ["Weathering / अपक्षय", "Volcanism / ज्वालामुखी क्रिया", "Mass wasting / बृहत् क्षरण", "Fluvial erosion / नदीीय अपरदन"],
        answer: 1
    },
    {
        question: "Peneplain concept is associated with which geomorphic agent?",
        hindi: "पेनीप्लेन (Peneplain) की अवधारणा किस भू-आकृतिक कारक से संबंधित है?",
        options: ["Glacier / हिमानी", "Wind / पवन", "Running water (River) / बहता जल (नदी)", "Underground water / भूमिगत जल"],
        answer: 2
    },
    {
        question: "The term 'Penck's concept of landscape development' uses which term for the initial landform?",
        hindi: "पेन्क के भू-दृश्य विकास सिद्धांत में प्रारंभिक स्थल रूप के लिए किस शब्द का प्रयोग किया गया है?",
        options: ["Peneplain", "Primarumpf", "Endrumpf", "Pediment"],
        answer: 1
    },
    {
        question: "Barchans are landforms created by which geomorphic process?",
        hindi: "बरखान (Barchans) किस भू-आकृतिक प्रक्रिया द्वारा निर्मित स्थल रूप हैं?",
        options: ["Wind deposition / पवन निक्षेपण", "Glacial deposition / हिमानी निक्षेपण", "Wave erosion / तरंग अपरदन", "River deposition / नदी निक्षेपण"],
        answer: 0
    },
    {
        question: "Yardang is a landform formed by which action?",
        hindi: "यारडांग (Yardang) का निर्माण किस क्रिया द्वारा होता है?",
        options: ["Wind erosion / पवन अपरदन", "Glacial erosion / हिमानी अपरदन", "Fluvial deposition / नदीीय निक्षेपण", "Underground water solution / भूमिगत जल घोलन"],
        answer: 0
    },
    {
        question: "Hanging valleys are characteristic feature of which landscape?",
        hindi: "लटकती घाटियाँ (Hanging Valleys) किस भू-दृश्य की विशिष्ट विशेषता हैं?",
        options: ["Karst region / कास्ट प्रदेश", "Glacial region / हिमानी प्रदेश", "Arid region / शुष्क प्रदेश", "Coastal region / तटीय प्रदेश"],
        answer: 1
    },
    {
        question: "Uvalas and Poljes are landforms typical of:",
        hindi: "युवाला (Uvalas) और पोल्ये (Poljes) किस प्रकार के स्थलरूपों की विशेषता हैं?",
        options: ["Arid topography / शुष्क स्थलरूप", "Karst topography / कास्ट्र स्थलरूप", "Glacial topography / हिमानी स्थलरूप", "Coastal topography / तटीय स्थलरूप"],
        answer: 1
    },
    {
        question: "Esker is a landform produced by:",
        hindi: "एस्कर (Esker) का निर्माण किसके द्वारा होता है?",
        options: ["Glacio-fluvial deposition / हिमनदी-जलीय निक्षेपण", "Wind erosion / पवन अपरदन", "Sea waves / समुद्री तरंगें", "River erosion / नदी अपरदन"],
        answer: 0
    },
    {
        question: "Ox-bow lakes are formed in which stage of a river?",
        hindi: "गोखुर झील (Ox-bow lake) का निर्माण नदी की किस अवस्था में होता है?",
        options: ["Youth stage / युवावस्था", "Mature to Old stage / प्रौढ़ावस्था से वृद्धावस्था", "Mountainous stage / पर्वतीय अवस्था", "Initial source stage / प्रारंभिक उद्गम अवस्था"],
        answer: 1
    },
    {
        question: "Plate Tectonics theory was comprehensively presented by:",
        hindi: "प्लेट विवर्तनिकी सिद्धांत (Plate Tectonics Theory) को व्यापक रूप से किसने प्रस्तुत किया था?",
        options: ["Alfred Wegener", "W.J. Morgan", "Arthur Holmes", "Harry Hess"],
        answer: 1
    },
    {
        question: "Mid-Oceanic Ridges are formed at which type of plate margin?",
        hindi: "मध्य-महासागरीय कटक (Mid-Oceanic Ridges) किस प्रकार की प्लेट सीमा पर बनते हैं?",
        options: ["Divergent plate boundary / अपसारी प्लेट सीमा", "Convergent plate boundary / अभिसारी प्लेट सीमा", "Transform boundary / रूपांतरित सीमा", "Collision zone / टकराव क्षेत्र"],
        answer: 0
    },
    {
        question: "Deep sea trenches are primarily formed at:",
        hindi: "गहरी महासागरीय गर्त (Deep Sea Trenches) मुख्य रूप से कहाँ बनती हैं?",
        options: ["Subduction zones (Convergent boundaries) / सबडक्शन क्षेत्र (अभिसारी सीमाएँ)", "Divergent boundaries / अपसारी सीमाएँ", "Transform fault zones / रूपांतरित भ्रंश क्षेत्र", "Continental interiors / महाद्वीपीय आंतरिक भाग"],
        answer: 0
    },
    {
        question: "Which wave travels fastest through the earth's interior during an earthquake?",
        hindi: "भूकंप के दौरान पृथ्वी के आंतरिक भाग में कौन-सी तरंग सबसे तेज गति से चलती है?",
        options: ["S-waves / S-तरंगें", "P-waves / P-तरंगें", "L-waves / L-तरंगें", "Raleigh waves / रेले तरंगें"],
        answer: 1
    },
    {
        question: "Moho discontinuity separates which two layers of Earth?",
        hindi: "मोहो असंबद्धता (Moho discontinuity) पृथ्वी की किन दो परतों को अलग करती है?",
        options: ["Crust and Mantle / पर्पटी और मेंटल", "Mantle and Core / मेंटल और क्रोड", "Inner core and Outer core / आंतरिक क्रोड और बाह्य क्रोड", "Sial and Sima / सियाल और सीमा"],
        answer: 0
    },
    {
        question: "Conrad discontinuity is found between:",
        hindi: "कॉनराड असंबद्धता (Conrad discontinuity) किसके बीच पाई जाती है?",
        options: ["Upper Crust and Lower Crust / ऊपरी क्रस्ट और निचली क्रस्ट", "Outer Mantle and Inner Mantle / बाह्य मेंटल और आंतरिक मेंटल", "Mantle and Core / मेंटल और कोर", "Upper Core and Lower Core / ऊपरी कोर और निचला कोर"],
        answer: 0
    },
    {
        question: "Blind valley is a feature commonly seen in:",
        hindi: "अंधी घाटी (Blind Valley) सामान्यतः किस क्षेत्र में देखने को मिलती है?",
        options: ["Karst topography / कास्ट स्थलरूप", "Arid regions / शुष्क क्षेत्र", "Glacial regions / हिमानी क्षेत्र", "Deltaic regions / डेल्टाई क्षेत्र"],
        answer: 0
    },
    {
        question: "Which of the following is a mechanical/physical weathering process?",
        hindi: "निम्नलिखित में से कौन-सी एक भौतिक/यांत्रिक अपक्षय प्रक्रिया है?",
        options: ["Exfoliation / अपपत्रण (Exfoliation)", "Carbonation / कार्बोनेशन", "Oxidation / ऑक्सीकरण", "Solution / घोलन"],
        answer: 0
    },
    {
        question: "Natural levees are formed by which process?",
        hindi: "प्राकृतिक तटबंध (Natural Levees) का निर्माण किस प्रक्रिया द्वारा होता है?",
        options: ["River deposition during floods / बाढ़ के दौरान नदीीय निक्षेपण", "Glacial movement / हिमानी प्रवाह", "Wind deflation / पवन अपवाहन", "Wave refraction / तरंग अपवर्तन"],
        answer: 0
    },
    {
        question: "Ria coast is an example of:",
        hindi: "रिया तट (Ria coast) किसका उदाहरण है?",
        options: ["Submerged river valley / निमग्न नदी घाटी", "Submerged glacial valley / निमग्न हिमानी घाटी", "Emerged coastline / उन्मग्न तटरेखा", "Neutral coastline / तटस्थ तटरेखा"],
        answer: 0
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;
let timeLeft = 45;
let timerInterval = null;

function startTimer() {
    timeLeft = 45;
    document.getElementById("timer").innerText = "⏱️ Time: " + timeLeft + "s";
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = "⏱️ Time: " + timeLeft + "s";
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            autoTimeOut();
        }
    }, 1000);
}

function autoTimeOut() {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    document.getElementById("answer").innerHTML = 
        "<strong style='color: #d97706;'>⏰ Time's Up!</strong><br>" +
        "<b>सही उत्तर:</b> " + q.options[q.answer];

    document.getElementById("nextBtn").style.display = "inline-block";
    
    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "See Final Result 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "Next Question ➡";
    }
}

function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById("progress").innerText = 
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML = 
        q.question + "<div class='hindi'>🇮🇳 " + q.hindi + "</div>";

    document.getElementById("answer").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.className = "option";
        button.onclick = function() {
            checkAnswer(index, button);
        };
        optionsDiv.appendChild(button);
    });

    startTimer();
}

function checkAnswer(selectedIndex, selectedButton) {
    if (answered) return;
    answered = true;
    clearInterval(timerInterval);

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    if (selectedIndex === q.answer) {
        score++;
        document.getElementById("answer").innerHTML = 
            "<strong style='color: green;'>✅ Correct Answer!</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    } else {
        selectedButton.classList.add("wrong");
        document.getElementById("answer").innerHTML = 
            "<strong style='color: red;'>❌ Wrong Answer!</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    }

    document.getElementById("nextBtn").style.display = "inline-block";

    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "See Final Result 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "Next Question ➡";
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    clearInterval(timerInterval);
    document.getElementById("question").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("answer").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress").style.display = "none";
    document.getElementById("timer").style.display = "none";

    document.getElementById("result").innerHTML = `
        <div id="score">
            🎉 Quiz Complete!
            <br><br>
            Your Score: ${score} / ${questions.length}
            <br><br>
            <button id="restartBtn" onclick="restartQuiz()">
                🔄 Restart Quiz
            </button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("question").style.display = "block";
    document.getElementById("options").style.display = "block";
    document.getElementById("answer").style.display = "block";
    document.getElementById("progress").style.display = "block";
    document.getElementById("timer").style.display = "block";

    document.getElementById("result").innerHTML = "";

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
