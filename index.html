<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oceanography NET/JRF Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            margin: 0;
            padding: 0;
        }
        .quiz-container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-top: 0;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef4ff;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        #progress {
            color: #555;
            font-size: 16px;
            font-weight: bold;
        }
        #timer {
            font-size: 17px;
            font-weight: bold;
            color: #d97706;
            background: #fef3c7;
            padding: 6px 14px;
            border-radius: 20px;
        }
        #question {
            font-size: 20px;
            line-height: 1.5;
            margin: 20px 0;
            font-weight: bold;
        }
        .hindi {
            color: #374151;
            font-size: 18px;
            margin-top: 8px;
        }
        .option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .option:hover {
            background: #eef4ff;
        }
        .correct {
            background: #b7f7c1 !important;
            border-color: green !important;
            font-weight: bold;
        }
        .wrong {
            background: #ffb7b7 !important;
            border-color: red !important;
        }
        #answer {
            margin-top: 15px;
            font-size: 18px;
            line-height: 1.5;
        }
        #nextBtn, #restartBtn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }
        #nextBtn:hover, #restartBtn:hover {
            background: #153da8;
        }
        #nextBtn {
            display: none;
        }
        #score {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>🌊 Oceanography NET/JRF Quiz</h1>
    
    <div class="quiz-header">
        <div id="progress"></div>
        <div id="timer">⏱️ Time: 45s</div>
    </div>

    <div id="question"></div>
    <div id="options"></div>
    <div id="answer"></div>
    
    <button id="nextBtn" onclick="nextQuestion()">Next Question ➡</button>
    <div id="result"></div>
</div>

<script>
const questions = [
    {
        question: "What is the average slope angle of the Continental Shelf?",
        hindi: "महाद्वीपीय मग्नतट (Continental Shelf) का औसत ढाल कोण कितना होता है?",
        options: ["1° to 3°", "2° to 5°", "5° to 10°", "10° to 15°"],
        answer: 0
    },
    {
        question: "Which feature occupies the maximum percentage of total ocean floor area?",
        hindi: "समस्त महासागरीय नितल के क्षेत्रफल के सर्वाधिक भाग पर कौन-सी भू-आकृति विस्तृत है?",
        options: ["Continental Shelf / महाद्वीपीय मग्नतट", "Continental Slope / महाद्वीपीय मग्नढाल", "Deep Sea Plains / गहरे महासागरीय मैदान", "Oceanic Trenches / महासागरीय गर्त"],
        answer: 2
    },
    {
        question: "Flat-topped submerged volcanic mountains are known as:",
        hindi: "सपाट शीर्ष वाले जलमग्न ज्वालामुखीय पर्वतों को किस नाम से जाना जाता है?",
        options: ["Seamounts / समुद्री पर्वत", "Guyots / गायोट", "Abyssal Hills / अगाध पहाड़ियाँ", "Submarine Canyons / जलमग्न कैनियन"],
        answer: 1
    },
    {
        question: "Which ocean has the highest average salinity?",
        hindi: "किस महासागर की औसत लवणता (Average Salinity) सबसे अधिक है?",
        options: ["Pacific Ocean / प्रशांत महासागर", "Atlantic Ocean / अटलांटिक महासागर", "Indian Ocean / हिंद महासागर", "Arctic Ocean / आर्कटिक महासागर"],
        answer: 1
    },
    {
        question: "A zone of rapid temperature change in ocean water with depth is called:",
        hindi: "महासागरीय जल में गहराई के साथ तापमान में तीव्र परिवर्तन की परत को क्या कहा जाता है?",
        options: ["Halocline / हैलोक्लाइन", "Thermocline / थर्मोक्लाइन", "Pycnocline / पाइकनोक्लाइन", "Isotherm / समताप रेखा"],
        answer: 1
    },
    {
        question: "Which of the following is a cold ocean current in the Pacific Ocean?",
        hindi: "निम्नलिखित में से कौन-सी प्रशांत महासागर की एक ठंडी महासागरीय धारा है?",
        options: ["Kuroshio Current / क्यूरोशियो धारा", "Oya Shio (Kamchatka) Current / ओयाशियो धारा", "North Equatorial Current / उत्तरी विषुवतीय धारा", "East Australian Current / पूर्वी ऑस्ट्रेलियाई धारा"],
        answer: 1
    },
    {
        question: "Benguela Current flows along the west coast of which continent?",
        hindi: "बेंगुएला धारा (Benguela Current) किस महाद्वीप के पश्चिमी तट के सहारे बहती है?",
        options: ["South America / दक्षिण अमेरिका", "Africa / अफ्रीका", "North America / उत्तर अमेरिका", "Australia / ऑस्ट्रेलिया"],
        answer: 1
    },
    {
        question: "Sargasso Sea is located in which ocean?",
        hindi: "सरगासो सागर (Sargasso Sea) किस महासागर में स्थित है?",
        options: ["North Atlantic Ocean / उत्तरी अटलांटिक महासागर", "South Atlantic Ocean / दक्षिणी अटलांटिक महासागर", "North Pacific Ocean / उत्तरी प्रशांत महासागर", "Indian Ocean / हिंद महासागर"],
        answer: 0
    },
    {
        question: "The Progressive Wave Theory of Tides was propounded by:",
        hindi: "ज्वार-भाटा का 'प्रगामी तरंग सिद्धांत' (Progressive Wave Theory) किसके द्वारा प्रतिपादित किया गया था?",
        options: ["Isaac Newton / आइज़ैक न्यूटन", "William Whewell / विलियम वेवेल", "G.B. Airy / जी.बी. एयरी", "R.A. Harris / आर.ए. हैरिस"],
        answer: 1
    },
    {
        question: "Stationary Wave Theory for the origin of tides was given by:",
        hindi: "ज्वार-भाटा की उत्पत्ति से संबंधित 'स्थैतिक तरंग सिद्धांत' (Stationary Wave Theory) किसने दिया था?",
        options: ["R.A. Harris / आर.ए. हैरिस", "Laplace / लाप्लास", "William Whewell / विलियम वेवेल", "Isaac Newton / आइज़ैक न्यूटन"],
        answer: 0
    },
    {
        question: "Neap Tides occur when the Sun, Earth, and Moon form an angle of:",
        hindi: "लघु ज्वार (Neap Tide) तब आते हैं जब सूर्य, पृथ्वी और चंद्रमा परस्पर कितने कोण पर होते हैं?",
        options: ["180° (Syzygy / युति-वियुति)", "90° (Quadrature / समकोण)", "45°", "0°"],
        answer: 1
    },
    {
        question: "Which ocean relief feature is 'Challenger Deep' associated with?",
        hindi: "'चैलेंजर डीप' (Challenger Deep) किस महासागरीय गर्त से संबंधित है?",
        options: ["Puerto Rico Trench / प्यूर्टो रिको गर्त", "Java Trench / जावा गर्त", "Mariana Trench / मरियाना गर्त", "Sunda Trench / सुंडा गर्त"],
        answer: 2
    },
    {
        question: "Pelagic deposits that consist of organic remains of plankton are mainly made of:",
        hindi: "वेलापवर्ती निक्षेप (Pelagic Deposits) जो प्लवक के कार्बनिक अवशेषों से बने होते हैं, मुख्य रूप से किसके बने होते हैं?",
        options: ["Ooze (Calcareous and Siliceous) / ऊज़ (चूनायुक्त एवं सिलिकायुक्त)", "Red Clay / लाल मृत्तिका", "Terrigenous Mud / स्थलजात पंक", "Volcanic Dust / ज्वालामुखीय धूल"],
        answer: 0
    },
    {
        question: "Pteropod and Globigerina oozes belong to which type of marine deposit?",
        hindi: "टेरोपोड (Pteropod) और ग्लोबीजेरीना (Globigerina) ऊज़ किस प्रकार के समुद्री निक्षेप हैं?",
        options: ["Siliceous Ooze / सिलिकायुक्त ऊज़", "Calcareous Ooze / चूनायुक्त ऊज़", "Terrigenous Deposit / स्थलजात निक्षेप", "Hydrogenous Deposit / जलजात निक्षेप"],
        answer: 1
    },
    {
        question: "Fringing reefs, Barrier reefs, and Atolls are types of:",
        hindi: "तटीय प्रवाल भित्ति (Fringing Reef), अवरोधक प्रवाल भित्ति (Barrier Reef) और अटॉल (Atoll) किसके प्रकार हैं?",
        options: ["Coral Reefs / प्रवाल भित्तियाँ", "Continental Margins / महाद्वीपीय सीमाएँ", "Oceanic Ridges / महासागरीय कटक", "Submarine Canyons / जलमग्न कैनियन"],
        answer: 0
    },
    {
        question: "Who proposed the 'Subsidence Theory' for the formation of Coral Reefs?",
        hindi: "प्रवाल भित्तियों के निर्माण से संबंधित 'अवतलन सिद्धांत' (Subsidence Theory) का प्रतिपादन किसने किया था?",
        options: ["Reginald Daly / रेजिनाल्ड डेली", "Charles Darwin / चार्ल्स डार्विन", "John Murray / जॉन मरे", "W.M. Davis / डब्ल्यू.एम. डेविस"],
        answer: 1
    },
    {
        question: "The Glacial Control Theory of coral reef formation was given by:",
        hindi: "प्रवाल भित्तियों के निर्माण का 'हिमनदीय नियंत्रण सिद्धांत' (Glacial Control Theory) किसने दिया था?",
        options: ["Charles Darwin / चार्ल्स डार्विन", "John Murray / जॉन मरे", "Reginald Daly / रेजिनाल्ड डेली", "L.C. King / एल.सी. किंग"],
        answer: 2
    },
    {
        question: "Ideal surface temperature range of ocean water required for coral reef survival is:",
        hindi: "प्रवाल भित्तियों (Corals) के जीवित रहने के लिए महासागरीय जल का आदर्श सतह तापमान कितना होना चाहिए?",
        options: ["10°C to 15°C", "20°C to 21°C", "30°C to 35°C", "35°C to 40°C"],
        answer: 1
    },
    {
        question: "Which ocean current is also known as 'El Niño' counter current's extension in Peru region?",
        hindi: "पेरू तट के निकट चलने वाली किस गरम धारा को एल-नीनो (El Niño) के प्रभाव से जोड़ा जाता है?",
        options: ["Humboldt Current / हम्बोल्ट धारा", "Counter Equatorial Current / विपरीत विषुवतीय धारा", "Falkland Current / फॉकलैंड धारा", "Agulhas Current / अगुलहास धारा"],
        answer: 1
    },
    {
        question: "Teleconnections in oceanography and meteorology are most closely related to:",
        hindi: "समुद्र विज्ञान एवं मौसम विज्ञान में 'दूर-संयोजन' (Teleconnections) का संबंध मुख्य रूप से किससे है?",
        options: ["ENSO (El Niño Southern Oscillation) / एनसो (ENSO)", "Tsunami formation / सुनामी निर्माण", "Continental Drift / महाद्वीपीय विस्थापन", "Sedimentation / अवसादन"],
        answer: 0
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;
let timeLeft = 45;
let timerInterval = null;

function startTimer() {
    timeLeft = 45;
    document.getElementById("timer").innerText = "⏱️ Time: " + timeLeft + "s";
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = "⏱️ Time: " + timeLeft + "s";
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            autoTimeOut();
        }
    }, 1000);
}

function autoTimeOut() {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    document.getElementById("answer").innerHTML = 
        "<strong style='color: #d97706;'>⏰ Time's Up!</strong><br>" +
        "<b>सही उत्तर:</b> " + q.options[q.answer];

    document.getElementById("nextBtn").style.display = "inline-block";
    
    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "See Final Result 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "Next Question ➡";
    }
}

function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById("progress").innerText = 
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML = 
        q.question + "<div class='hindi'>🇮🇳 " + q.hindi + "</div>";

    document.getElementById("answer").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.className = "option";
        button.onclick = function() {
            checkAnswer(index, button);
        };
        optionsDiv.appendChild(button);
    });

    startTimer();
}

function checkAnswer(selectedIndex, selectedButton) {
    if (answered) return;
    answered = true;
    clearInterval(timerInterval);

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    if (selectedIndex === q.answer) {
        score++;
        document.getElementById("answer").innerHTML = 
            "<strong style='color: green;'>✅ Correct Answer!</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    } else {
        selectedButton.classList.add("wrong");
        document.getElementById("answer").innerHTML = 
            "<strong style='color: red;'>❌ Wrong Answer!</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    }

    document.getElementById("nextBtn").style.display = "inline-block";

    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "See Final Result 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "Next Question ➡";
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    clearInterval(timerInterval);
    document.getElementById("question").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("answer").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress").style.display = "none";
    document.getElementById("timer").style.display = "none";

    document.getElementById("result").innerHTML = `
        <div id="score">
            🎉 Quiz Complete!
            <br><br>
            Your Score: ${score} / ${questions.length}
            <br><br>
            <button id="restartBtn" onclick="restartQuiz()">
                🔄 Restart Quiz
            </button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("question").style.display = "block";
    document.getElementById("options").style.display = "block";
    document.getElementById("answer").style.display = "block";
    document.getElementById("progress").style.display = "block";
    document.getElementById("timer").style.display = "block";

    document.getElementById("result").innerHTML = "";

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
