<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Reasoning NET/JRF Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            margin: 0;
            padding: 0;
        }
        .quiz-container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-top: 0;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef4ff;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        #progress {
            color: #555;
            font-size: 16px;
            font-weight: bold;
        }
        #question {
            font-size: 20px;
            line-height: 1.5;
            margin: 20px 0;
            font-weight: bold;
        }
        .hindi {
            color: #374151;
            font-size: 18px;
            margin-top: 8px;
        }
        .option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .option:hover {
            background: #eef4ff;
        }
        .correct {
            background: #b7f7c1 !important;
            border-color: green !important;
            font-weight: bold;
        }
        .wrong {
            background: #ffb7b7 !important;
            border-color: red !important;
        }
        #answer {
            margin-top: 15px;
            font-size: 18px;
            line-height: 1.5;
        }
        #nextBtn, #restartBtn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }
        #nextBtn:hover, #restartBtn:hover {
            background: #153da8;
        }
        #nextBtn {
            display: none;
        }
        #score {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>🧩 Mathematical Reasoning Quiz</h1>
    
    <div class="quiz-header">
        <div id="progress"></div>
    </div>

    <div id="question"></div>
    <div id="options"></div>
    <div id="answer"></div>
    
    <button id="nextBtn" onclick="nextQuestion()">Next Question ➡</button>
    <div id="result"></div>
</div>

<script>
const questions = [
    {
        question: "Find the missing term in the series: 2, 10, 30, 68, 130, ?",
        hindi: "दी गई श्रृंखला में लुप्त पद ज्ञात कीजिए: 2, 10, 30, 68, 130, ?",
        options: ["216", "222", "210", "240"],
        answer: 1
    },
    {
        question: "In a certain code language, 'TEACHER' is written as 'VGCEJGT'. How will 'CHILDREN' be written in that code?",
        hindi: "एक निश्चित कूट भाषा में 'TEACHER' को 'VGCEJGT' लिखा जाता है। उसी कूट भाषा में 'CHILDREN' को कैसे लिखा जाएगा?",
        options: ["EJKNFTGP", "EJKDFTOG", "EJHTLIEN", "FKJNHTGP"],
        answer: 0
    },
    {
        question: "If A is the brother of B, B is the sister of C, and C is the father of D, how is A related to D?",
        hindi: "यदि A, B का भाई है; B, C की बहन है; और C, D का पिता है, तो A का D से क्या संबंध है?",
        options: ["Father / पिता", "Uncle / चाचा (अंकल)", "Brother / भाई", "Grandfather / दादा"],
        answer: 1
    },
    {
        question: "A man walks 5 km towards South, then turns right and walks 3 km. He turns left and walks 5 km. In which direction is he now from the starting point?",
        hindi: "एक व्यक्ति दक्षिण की ओर 5 किमी चलता है, फिर दाएँ मुड़कर 3 किमी चलता है। वह फिर बाएँ मुड़कर 5 किमी चलता है। अब वह प्रारंभिक बिंदु से किस दिशा में है?",
        options: ["South-West / दक्षिण-पश्चिम", "South-East / दक्षिण-पूर्व", "North-West / उत्तर-पश्चिम", "South / दक्षिण"],
        answer: 0
    },
    {
        question: "The average of 5 consecutive numbers is 27. What is the product of the largest and the smallest number?",
        hindi: "5 क्रमागत संख्याओं का औसत 27 है। सबसे बड़ी और सबसे छोटी संख्या का गुणनफल क्या होगा?",
        options: ["725", "720", "700", "729"],
        answer: 1
    },
    {
        question: "A train 150 meters long is running at a speed of 54 km/h. How much time will it take to cross a platform of 250 meters long?",
        hindi: "150 मीटर लंबी एक रेलगाड़ी 54 किमी/घंटा की गति से चल रही है। 250 मीटर लंबे प्लेटफॉर्म को पार करने में इसे कितना समय लगेगा?",
        options: ["20 seconds / 20 सेकंड", "24 seconds / 24 सेकंड", "26.6 seconds / 26.6 सेकंड", "30 seconds / 30 सेकंड"],
        answer: 2
    },
    {
        question: "A person sells an article for ₹480 and incurs a loss of 20%. At what price should he sell it to gain 20% profit?",
        hindi: "एक व्यक्ति किसी वस्तु को ₹480 में बेचता है और उसे 20% की हानि होती है। 20% का लाभ कमाने के लिए उसे इसे किस मूल्य पर बेचना चाहिए?",
        options: ["₹600", "₹720", "₹640", "₹700"],
        answer: 1
    },
    {
        question: "Two numbers are in the ratio 3 : 5. If 9 is subtracted from each, the new ratio becomes 12 : 23. What is the smaller number?",
        hindi: "दो संख्याएँ 3 : 5 के अनुपात में हैं। यदि प्रत्येक में से 9 घटा दिया जाए, तो नया अनुपात 12 : 23 हो जाता है। छोटी संख्या क्या है?",
        options: ["27", "33", "48", "55"],
        answer: 1
    },
    {
        question: "A sum of money at simple interest doubles itself in 8 years. In how many years will it become 4 times of itself at the same rate of interest?",
        hindi: "साधारण ब्याज पर कोई धन 8 वर्षों में स्वयं का दोगुना हो जाता है। समान ब्याज दर पर यह कितने वर्षों में स्वयं का 4 गुना हो जाएगा?",
        options: ["16 years / 16 वर्ष", "24 years / 24 वर्ष", "32 years / 32 वर्ष", "20 years / 20 वर्ष"],
        answer: 1
    },
    {
        question: "A and B can complete a work in 12 days and 18 days respectively. They started working together, but A left after 3 days. In how many days will B alone finish the remaining work?",
        hindi: "A और B किसी काम को क्रमशः 12 दिन और 18 दिन में पूरा कर सकते हैं। वे एक साथ काम शुरू करते हैं, लेकिन 3 दिन बाद A काम छोड़ देता है। शेष काम को B अकेला कितने दिनों में पूरा करेगा?",
        options: ["10.5 days / 10.5 दिन", "12 days / 12 दिन", "13.5 days / 13.5 दिन", "15 days / 15 दिन"],
        answer: 0
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];

    document.getElementById("progress").innerText = 
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerHTML = 
        q.question + "<div class='hindi'>🇮🇳 " + q.hindi + "</div>";

    document.getElementById("answer").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.className = "option";
        button.onclick = function() {
            checkAnswer(index, button);
        };
        optionsDiv.appendChild(button);
    });
}

function checkAnswer(selectedIndex, selectedButton) {
    if (answered) return;
    answered = true;

    const q = questions[currentQuestion];
    const allOptions = document.querySelectorAll(".option");

    allOptions[q.answer].classList.add("correct");

    if (selectedIndex === q.answer) {
        score++;
        document.getElementById("answer").innerHTML = 
            "<strong style='color: green;'>✅ Correct Answer!</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    } else {
        selectedButton.classList.add("wrong");
        document.getElementById("answer").innerHTML = 
            "<strong style='color: red;'>❌ Wrong Answer!</strong><br>" +
            "<b>सही उत्तर:</b> " + q.options[q.answer];
    }

    document.getElementById("nextBtn").style.display = "inline-block";

    if (currentQuestion === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "See Final Result 🎯";
    } else {
        document.getElementById("nextBtn").innerText = "Next Question ➡";
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("question").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("answer").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress").style.display = "none";

    document.getElementById("result").innerHTML = `
        <div id="score">
            🎉 Quiz Complete!
            <br><br>
            Your Score: ${score} / ${questions.length}
            <br><br>
            <button id="restartBtn" onclick="restartQuiz()">
                🔄 Restart Quiz
            </button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("question").style.display = "block";
    document.getElementById("options").style.display = "block";
    document.getElementById("answer").style.display = "block";
    document.getElementById("progress").style.display = "block";

    document.getElementById("result").innerHTML = "";

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
